<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Djamalou Services – Food truck</title>
<style>
:root{--bg:#f4eefa;--card:#fff;--ink:#2a1840;--mute:#76668a;--main:#6b2fa0;--on:#fff;--hot:#c8372d;--line:#e3d8ef;--ok:#2f7d4f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1029;--card:#2a1a3f;--ink:#f3ecfa;--mute:#b4a3c9;--main:#c9a2ff;--on:#1b1029;--hot:#ff7a6b;--line:#3d2a57;--ok:#7fd1a0}}
:root[data-theme="dark"]{--bg:#1b1029;--card:#2a1a3f;--ink:#f3ecfa;--mute:#b4a3c9;--main:#c9a2ff;--on:#1b1029;--hot:#ff7a6b;--line:#3d2a57;--ok:#7fd1a0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Trebuchet MS",system-ui,sans-serif}
body{max-width:640px;margin:0 auto;padding:12px 14px 90px}
h1{font-size:22px;margin:6px 0 2px;letter-spacing:-.3px}
.sub{color:var(--mute);font-size:14px;margin:0 0 8px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;font-size:14px}
nav button.on{background:var(--main);color:var(--on);border-color:var(--main)}
nav.s{position:static;padding:0 0 4px}nav.s button{font-size:13px;padding:8px 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.item{padding:0 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:left;font:inherit;position:relative;overflow:hidden}
.item b,.item span,.item em{display:block;padding:0 10px}.item b{font-size:15px;margin-top:6px}.item span{color:var(--mute);font-size:13px}
.item em{font-style:normal;font-size:12px;color:var(--ok);font-weight:600}.item em.low{color:var(--hot)}
.item img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph{background:var(--line);color:var(--mute);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700}
.item i{position:absolute;top:8px;right:8px;background:var(--hot);color:#fff;border-radius:99px;font-style:normal;font-size:13px;min-width:24px;text-align:center;padding:1px 7px}
.item.out{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
.grow{flex:1;min-width:0}
.big{font-size:26px;font-weight:700}
.pay{width:100%;padding:15px;border:0;border-radius:12px;background:var(--main);color:var(--on);font:inherit;font-weight:700;font-size:17px;margin-top:8px}
.pay:disabled{opacity:.4}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;display:inline-block}
.del{color:var(--hot);background:none;border:0;font:inherit;font-size:22px;padding:0 6px}
input{font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
input[type=file]{display:none}
select{font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.f{display:flex;gap:8px;margin:6px 0;align-items:center}
.q{width:80px;flex:none}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--hot);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:14px}
.note{color:var(--mute);font-size:13px}
#splash{position:fixed;inset:0;background:#4b1d7a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:9;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
#splash h2{margin:14px 0 0;font-size:26px;letter-spacing:-.3px}#splash p{margin:0;opacity:.8}
#lg img{width:min(86vw,380px);height:auto;border-radius:24px;background:#fff;padding:14px;display:block}
.mono{width:150px;height:150px;border-radius:28px;background:#fff;color:#6b2fa0;font-size:84px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media(prefers-reduced-motion:reduce){#splash{transition:none}}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
</style>
</head>
<body>
<div id="splash" onclick="this.classList.add('off')"><div id="lg"></div><h2>Djamalou Services</h2><p>Food truck</p></div>
<h1>Djamalou Services</h1>
<p class="sub">Gestion du food truck</p>
<nav id="nav"></nav>
<p class="note" id="st" role="status"></p>
<main id="v"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=n=>Math.round(n).toLocaleString('fr-FR').replace(/\u202f/g,' ')+' FCFA';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let S={menu:[{id:'a',name:'Sandwich poulet',price:1500},{id:'b',name:'Burger',price:2000},{id:'c',name:'Shawarma',price:1500},{id:'d',name:'Frites',price:500},{id:'e',name:'Jus bissap',price:300},{id:'f',name:'Eau',price:200}],sales:[],exp:[],mep:[],pin:''};
try{const r=localStorage.getItem('djamalou_ft');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let db=null,canW=true;
const loc=()=>{try{localStorage.setItem('djamalou_ft',JSON.stringify(S))}catch(e){}};
const dayDoc=d=>({d,sales:S.sales.filter(s=>s.d===d),exp:S.exp.filter(e=>e.d===d),mep:S.mep.filter(x=>x.d===d)});
async function save(...k){
if(db&&!canW){alert('Consultation seule : ce téléphone ne peut pas modifier.');location.reload();return}
loc();if(!db)return;
try{if(k.includes('menu'))await db.doc('menu/main').set({items:S.menu});
if(k.includes('pin'))await db.doc('cfg/main').set({pin:S.pin,logo:S.logo||''});
if(k.includes('day'))await db.doc('days/'+today()).set(dayDoc(today()))}
catch(e){setSt('Erreur de synchronisation. Réessaie.')}}
function setSt(t){const e=$('#st');if(e)e.textContent=t}
function redraw(){const a=document.activeElement;if(a&&a.tagName==='INPUT')return;draw()}
async function initDb(){
try{const c=window.claude;if(!c)return setSt('Hors ligne : données sur ce téléphone seulement.');
db=await c.use('db');const u=await c.use('user');
if(!db)return setSt('Hors ligne : connecte-toi à Claude pour partager les données.');
canW=u?u.can('data.write')!==false:true;
setSt(canW?'En ligne : synchronisé entre les téléphones.':'En ligne : consultation seule.');
const er=()=>setSt('Connexion perdue. Recharge la page.');
db.doc('menu/main').onSnapshot(s=>{if(s.exists){S.menu=s.data().items||[];loc();redraw()}},er);
db.doc('cfg/main').onSnapshot(s=>{if(s.exists){S.pin=s.data().pin||'';S.logo=s.data().logo||'';loc();logo();redraw()}},er);
db.collection('days').orderBy('d','desc').limit(400).onSnapshot(q=>{S.sales=[];S.exp=[];S.mep=[];q.docs.forEach(x=>{const v=x.data();S.sales.push(...(v.sales||[]));S.exp.push(...(v.exp||[]));S.mep.push(...(v.mep||[]))});loc();redraw()},er)
}catch(e){setSt('Hors ligne : données sur ce téléphone seulement.')}}
let tab='vente',sub='menu',cart={},day=today(),open=false,np='';
const tracked=m=>m.stock!=null;
const img=(m,c)=>m.photo?`<img class="${c}" src="${m.photo}" alt="">`:(c==='th'?`<div class="th"></div>`:`<div class="ph">${esc(m.name.charAt(0).toUpperCase())}</div>`);
function nav(){
$('#nav').innerHTML=[['vente','Vente'],['stock','Stock'],['admin','Admin']].map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';if(k==='vente')open=false;draw()">${l}${k!=='vente'&&!open?' 🔒':''}</button>`).join('')}
function vente(){
const t=S.menu.reduce((a,m)=>a+(cart[m.id]||0)*m.price,0),n=Object.values(cart).reduce((a,b)=>a+b,0);
$('#v').innerHTML=(S.menu.length?`<div class="grid">${S.menu.map(m=>{const out=tracked(m)&&m.stock<=0;return`<button class="item ${out?'out':''}" ${out?'disabled':''} onclick="add('${m.id}',1)">${cart[m.id]?`<i>${cart[m.id]}</i>`:''}${img(m,'')}<b>${esc(m.name)}</b><span>${F(m.price)}</span>${tracked(m)?`<em class="${m.stock<=3?'low':''}">${out?'Épuisé':'Reste '+(m.stock-(cart[m.id]||0))}</em>`:''}</button>`}).join('')}</div>`:'<p class="empty">Ajoute des produits dans Admin › Menu.</p>')+
`<div class="card"><div class="row"><span>Commande en cours</span><span class="big">${F(t)}</span></div>${S.menu.filter(m=>cart[m.id]).map(m=>`<div class="row"><span>${cart[m.id]} × ${esc(m.name)}</span><button class="ghost" onclick="add('${m.id}',-1)">−</button></div>`).join('')}
<nav class="s">${['Espèces','Wave','Orange Money'].map(k=>`<button class="${k===pm?'on':''}" onclick="pm='${k}';draw()">${k}</button>`).join('')}</nav><button class="pay" ${n?'':'disabled'} onclick="pay()">Encaisser ${n?F(t):''}</button></div>
<div class="card"><div class="row"><span>Ventes du jour</span><b>${F(S.sales.filter(s=>s.d===today()).reduce((a,s)=>a+s.t,0))}</b></div></div>`}
function add(id,q){const m=S.menu.find(x=>x.id===id);if(q>0&&tracked(m)&&(cart[id]||0)>=m.stock)return;cart[id]=Math.max(0,(cart[id]||0)+q);if(!cart[id])delete cart[id];draw()}
function pay(){const items=S.menu.filter(m=>cart[m.id]).map(m=>({n:m.name,q:cart[m.id],p:m.price,c:m.cost||0}));if(!items.length)return;
S.menu.forEach(m=>{if(cart[m.id]&&tracked(m))m.stock=Math.max(0,m.stock-cart[m.id])});
S.sales.push({id:uid(),d:today(),h:new Date().toTimeString().slice(0,5),items,pm,t:items.reduce((a,i)=>a+i.q*i.p,0)});cart={};save('menu','day');draw()}
function stock(){
if(!open){admin();return}
$('#v').innerHTML=`<p class="note">Mise en place : entre la quantité préparée. Le reste baisse à chaque vente.</p><div class="card">${S.menu.length?S.menu.map(m=>`<div class="row">${img(m,'th')}<div class="grow"><b>${esc(m.name)}</b><div class="${tracked(m)&&m.stock<=3?'minus':'note'}">${tracked(m)?'Reste : '+m.stock:'Stock non suivi'}</div></div><input class="q" id="q${m.id}" type="number" inputmode="numeric" placeholder="Qté"><button class="ghost" onclick="mep('${m.id}')">Ajouter</button></div>`).join(''):'<p class="empty">Aucun produit.</p>'}</div>
<button class="ghost" onclick="zero()">Remettre tous les restes à zéro</button>`}
function mep(id){const q=parseInt($('#q'+id).value);if(!(q>0))return;const m=S.menu.find(x=>x.id===id);m.stock=(m.stock||0)+q;S.mep.push({d:today(),id,q});save('menu','day');draw()}
function zero(){if(confirm('Remettre tous les restes à zéro ?')){S.menu.forEach(m=>{if(tracked(m))m.stock=0});save('menu');draw()}}
function admin(){
if(!open){
$('#v').innerHTML=S.pin?`<div class="card"><b>Code admin</b><div class="f"><input id="pi" type="password" inputmode="numeric" placeholder="Code"></div><button class="pay" onclick="unlock()">Déverrouiller</button></div>`
:`<div class="card"><b>Crée un code admin (4 chiffres ou plus)</b><p class="note">Il protège le menu, les dépenses et le bilan.</p><div class="f"><input id="pi" type="password" inputmode="numeric" placeholder="Nouveau code"></div><button class="pay" onclick="setPin()">Enregistrer le code</button></div>`;return}
const subs=[['menu','Menu'],['dep','Dépenses'],['bilan','Bilan'],['code','Réglages']];
$('#v').innerHTML=`<nav class="s">${subs.map(([k,l])=>`<button class="${k===sub?'on':''}" onclick="sub='${k}';draw()">${l}</button>`).join('')}</nav><div id="s"></div><button class="ghost" onclick="open=false;draw()">🔒 Verrouiller</button>`;
({menu:menuV,dep:depV,bilan:bilanV,code:codeV})[sub]()}
function unlock(){if($('#pi').value===S.pin){open=true;draw()}else alert('Code incorrect.')}
function setPin(){const p=$('#pi').value.trim();if(p.length<4)return alert('Minimum 4 caractères.');S.pin=p;open=true;save('pin');draw()}

function logo(){$('#lg').innerHTML=`<img src="${S.logo||LOGO0}" alt="Logo Djamalou Services">`}
function setLogo(f){if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const s=Math.min(1,220/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');save('pin');logo();draw()};im.src=e.target.result};r.readAsDataURL(f)}
function codeV(){$('#s').innerHTML=`<div class="card"><b>Logo (écran d'accueil)</b><div class="f"><label class="ghost">Choisir le logo<input type="file" accept="image/*" onchange="setLogo(this.files[0])"></label></div></div><div class="card"><b>Changer le code</b><div class="f"><input id="pi" type="password" inputmode="numeric" placeholder="Nouveau code"></div><button class="pay" onclick="setPin()">Enregistrer le code</button></div>`}
function photo(file,cb){const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const s=Math.min(1,260/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.src=e.target.result};r.readAsDataURL(file)}
function menuV(){
$('#s').innerHTML=`<div class="card"><b>Nouveau produit</b><div class="f"><input id="mn" placeholder="Nom du produit"><input id="mp" type="number" inputmode="numeric" placeholder="Prix de vente"></div><div class="f"><input id="mc" type="number" inputmode="numeric" placeholder="Prix d'achat (coût)"></div>
<div class="f"><label class="ghost">📷 Photo<input type="file" accept="image/*" onchange="photo(this.files[0],d=>{np=d;$('#pv').src=d;$('#pv').hidden=false})"></label><img id="pv" class="th" hidden alt=""></div><button class="pay" onclick="addMenu()">Ajouter au menu</button></div>
<div class="card">${S.menu.length?S.menu.map(m=>`<div class="row">${img(m,'th')}<div class="grow"><b>${esc(m.name)}</b><div class="note">${F(m.price)}${m.cost?' · coût '+F(m.cost):''}</div></div><button class="ghost" onclick="edit('${m.id}')">Modifier</button><label class="ghost">📷<input type="file" accept="image/*" onchange="chPhoto('${m.id}',this.files[0])"></label><button class="del" aria-label="Supprimer" onclick="delMenu('${m.id}')">×</button></div>`).join(''):'<p class="empty">Aucun produit.</p>'}</div>`}
function addMenu(){const n=$('#mn').value.trim(),p=parseFloat($('#mp').value),c=parseFloat($('#mc').value)||0;if(!n||!(p>=0))return;S.menu.push({id:uid(),name:n,price:p,cost:c,photo:np});np='';save('menu');draw()}
function chPhoto(id,f){if(f)photo(f,d=>{S.menu.find(m=>m.id===id).photo=d;save('menu');draw()})}
function edit(id){const m=S.menu.find(x=>x.id===id),n=prompt('Nom',m.name);if(n===null)return;const p=parseFloat(prompt('Prix (FCFA)',m.price));const c=parseFloat(prompt('Prix d\'achat (FCFA)',m.cost||0));if(n.trim())m.name=n.trim();if(p>=0)m.price=p;if(c>=0)m.cost=c;save('menu');draw()}
function delMenu(id){if(confirm('Supprimer ce produit ?')){S.menu=S.menu.filter(m=>m.id!==id);delete cart[id];save('menu');draw()}}
function depV(){
const l=S.exp.filter(e=>e.d===today());
$('#s').innerHTML=`<div class="card"><b>Nouvelle dépense</b><div class="f"><input id="en" placeholder="Ex : gaz, pain, carburant"><input id="ea" type="number" inputmode="numeric" placeholder="Montant"></div><div class="f"><select id="ec">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><button class="pay" onclick="addExp()">Enregistrer la dépense</button></div>
<div class="card"><div class="row"><span>Dépenses du jour</span><b>${F(l.reduce((a,e)=>a+e.a,0))}</b></div>${l.length?l.map(e=>`<div class="row"><span>${esc(e.l)} <span class="note">${esc(e.cat||'')}</span></span><span>${F(e.a)} <button class="del" aria-label="Supprimer" onclick="delExp('${e.id}')">×</button></span></div>`).join(''):'<p class="empty">Aucune dépense aujourd\'hui.</p>'}</div>`}
function addExp(){const l=$('#en').value.trim(),a=parseFloat($('#ea').value),cat=$('#ec').value;if(!l||!(a>0))return;S.exp.push({id:uid(),d:today(),l,a,cat});save('day');draw()}
function delExp(id){S.exp=S.exp.filter(e=>e.id!==id);save('day');draw()}
let per='jour',pm='Espèces';
const CATS=['Ingrédients','Gaz et carburant','Salaires','Loyer','Transport','Autre'];
const fd=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
function rng(){const[y,m,d]=day.split('-').map(Number),w=(new Date(y,m-1,d).getDay()+6)%7;
if(per==='semaine')return[fd(new Date(y,m-1,d-w)),fd(new Date(y,m-1,d-w+6))];
if(per==='mois')return[fd(new Date(y,m-1,1)),fd(new Date(y,m,0))];
if(per==='annee')return[y+'-01-01',y+'-12-31'];return[day,day]}
const inR=x=>{const r=rng();return x>=r[0]&&x<=r[1]};
const lbl=()=>{const r=rng();return r[0]===r[1]?r[0]:r[0]+' au '+r[1]};
function report(){
const sv=S.sales.filter(s=>inR(s.d)),ex=S.exp.filter(e=>inR(e.d)),tv=sv.reduce((a,s)=>a+s.t,0),te=ex.reduce((a,e)=>a+e.a,0),by={};
sv.forEach(s=>s.items.forEach(i=>{by[i.n]=by[i.n]||{q:0,t:0};by[i.n].q+=i.q;by[i.n].t+=i.q*i.p}));
const bc={},bp={};ex.forEach(e=>{const k=e.cat||'Autre';bc[k]=(bc[k]||0)+e.a});sv.forEach(s=>{const k=s.pm||'Espèces';bp[k]=(bp[k]||0)+s.t});
const mg=sv.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.q*(i.p-(i.c||0)),0),0);
const rows=S.menu.map(m=>({n:m.name,mep:S.mep.filter(x=>inR(x.d)&&x.id===m.id).reduce((a,x)=>a+x.q,0),sold:(by[m.name]||{q:0}).q,left:per==='jour'&&day===today()&&tracked(m)?m.stock:null})).filter(r=>r.mep||r.sold);
return{sv,ex,tv,te,by,rows,bc,bp,mg,b:tv-te}}
function bilanV(){
const r=report();
$('#s').innerHTML=`<nav class="s">${[['jour','Jour'],['semaine','Semaine'],['mois','Mois'],['annee','Année']].map(([k,l])=>`<button class="${k===per?'on':''}" onclick="per='${k}';draw()">${l}</button>`).join('')}</nav><div class="card"><input type="date" value="${day}" onchange="day=this.value;draw()"><p class="note">${lbl()}</p></div>
<div class="card"><div class="row"><span>Ventes (${r.sv.length})</span><b>${F(r.tv)}</b></div><div class="row"><span>Marge sur les produits</span><b>${F(r.mg)}</b></div><div class="row"><span>Dépenses</span><b>${F(r.te)}</b></div><div class="row"><span>Bénéfice</span><span class="big ${r.b>=0?'plus':'minus'}">${F(r.b)}</span></div></div>
<div class="card"><b>Ventes par paiement</b>${Object.entries(r.bp).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${F(v)}</b></div>`).join('')||'<p class="empty">Aucune vente.</p>'}</div>
<div class="card"><b>Dépenses par catégorie</b>${Object.entries(r.bc).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${F(v)}</b></div>`).join('')||'<p class="empty">Aucune dépense.</p>'}</div>
<div class="card"><b>Mise en place, vendu, reste</b>${r.rows.length?r.rows.map(x=>`<div class="row"><span>${esc(x.n)}</span><span class="note">prép. ${x.mep} · vendu ${x.sold}${x.left!=null?' · reste '+x.left:''}</span></div>`).join(''):'<p class="empty">Rien ce jour-là.</p>'}</div>
<button class="pay" onclick="copyR()">Copier le rapport</button>`}
function copyR(){
const r=report();let t=`Djamalou Services – Rapport du ${lbl()}\nVentes : ${F(r.tv)}\nDépenses : ${F(r.te)}\nBénéfice : ${F(r.b)}\nMarge produits : ${F(r.mg)}\n${Object.entries(r.bp).map(([k,v])=>k+' : '+F(v)).join('\n')}\n\n`+r.rows.map(x=>`${x.n} : prép. ${x.mep}, vendu ${x.sold}${x.left!=null?', reste '+x.left:''}`).join('\n');
const ok=()=>alert('Rapport copié. Colle-le dans WhatsApp.');
try{navigator.clipboard.writeText(t).then(ok,()=>prompt('Copie ce rapport :',t))}catch(e){prompt('Copie ce rapport :',t)}}
function draw(){nav();({vente,stock,admin})[tab]()}
draw();logo();setTimeout(()=>$('#splash').classList.add('off'),1800);initDb();
</script>
</body>
